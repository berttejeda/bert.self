### Build settings ###

theme:
  name: material
  palette:
  - scheme: default
    primary: indigo
    accent: teal
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - scheme: slate
    primary: indigo
    accent: teal
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  #favicon: img/favicon.ico
  features:
    - search.suggest
    - search.highlight
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
  logo: docs/theme/images/logo.jpg
  icon:
    repo: fontawesome/brands/github-alt
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16  
  font:
      text: Ubuntu
      code: Source Code Pro 

# Bootstrap/DataTables assets (docs/theme) are only needed by the cheat_page macro;
# include them per page if that macro is used, since they override Material's styles.


markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - codehilite
  - footnotes
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true  
  - pymdownx.snippets:
      base_path: docs  
  - pymdownx.superfences:
      custom_fences:
        - name: pymdownx
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format  
        - name: mermaid # Take the fenced parts marked with mermaid
          class: mermaid # Turn them into class='mermaid'.
          format: !!python/name:mermaid2.fence_mermaid # To format those pieces, 
                                                       # use the function fence_mermaid, 
                                                       # from the mermaid2 package.
  - toc:
      permalink: true

plugins:
  - mermaid2
  - macros:
      module_name: docs/macros
      include_dir: .
  - same-dir
  - search:
      lang: ["en"]
      
nav:
   - Home: index.md
   - Projects: docs/projects.md
   - Activity: docs/activity.md
   - Notes:
      - docs/notes.md
      - Ansible:
         - Lesson 01: docs/topics/ansible/lesson-01/lesson.md
         - Portable Ansible on Windows 7 (Cygwin): docs/topics/ansible/windows/ansible-on-windows-7-with-cygwin.md
      - Crossplane:
         - Lesson 01: docs/topics/crossplane/lesson-01/lesson.md
         - Lesson 02: docs/topics/crossplane/lesson-02/lesson.md
      - Kubernetes:
         - Lesson 01: docs/topics/kubernetes/lesson-01/lesson.md
         - Lesson 02: docs/topics/kubernetes/lesson-02/lesson.md
         - Docker Volume Mounts and Autofs: docs/topics/kubernetes/troubleshooting/docker-volume-mounts-and-autofs.md
         - Pod Tolerates Node Taints: docs/topics/kubernetes/troubleshooting/pod_tolerates_node_taints.md
      - pfSense:
         - Boot Failure After Upgrading to 2.4.0: docs/topics/pfsense/troubleshooting/boot-failure-after-upgrade-to-2-4-0.md
      - Terraform:
         - Lesson 01: docs/topics/terraform/lesson-01/lesson.md
      - About This Site (MkDocs):
         - Overview: docs/about-mkdocs.md
         - Quickstart: docs/tutorial/quickstart.md
         - TL;DR: docs/tutorial/tldr.md
         - Installation: docs/tutorial/installation.md
         - Set up project: docs/tutorial/setup-project.md
         - Advanced: docs/tutorial/advanced.md
         - Usage: docs/tutorial/usage.md
         - Deploy: docs/tutorial/deploy.md
