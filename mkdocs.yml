### Site metadata ###

site_name: Bert Tejeda
site_description: DevOps & Platform Engineer — infrastructure as code, automation tooling, and open-source developer experience
site_author: Bert Tejeda
site_url: https://bertdotself.com/

repo_url: https://github.com/berttejeda/bert.self
repo_name: berttejeda/bert.self
edit_uri:
dev_addr: '0.0.0.0:8000'

docs_dir: .
site_dir: site

# README.md documents the repo itself; index.md is the site's home page
exclude_docs: |
  README.md

### global variables ###
